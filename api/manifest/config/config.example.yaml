server:
  address: "127.0.0.1:8085"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
logger:
  level: "info"
  stdout: true
database:
  default:
    type: "pgsql"
    host: "127.0.0.1"
    port: "5432"
    user: "postgres"
    pass: "postgres"
    name: "blog"
    sslmode: "disable"

blog:
  siteSlug: "blog-main"
  assetSpace: "yueli"
  traffic:
    # Immutable after this siteSlug's traffic instance is initialized.
    timeZone: "Asia/Shanghai"
  authorization:
    bootstrapAdministratorSubs: []
  jwks:
    url: "http://localhost:8081/oauth2/jwks.json"
    issuer: "http://localhost:8081"
    audience: "blog-main-web"
    allowLoopbackHttp: true
  identity:
    baseUrl: "http://localhost:8081"
  assetService:
    baseUrl: "http://localhost:8082"
  coverCategory: "blog-cover"
  siteUrl: "http://localhost:3002"
  siteBrand: "博客"
  siteDescription: "想法、笔记与记录"
  locale: "zh-CN"
  discovery:
    ttl: "5m"
  commentGuard:
    blacklist: []
    maxLinks: 3
    ratePerWindow: 5
    rateWindowSeconds: 60
  abuse:
    turnstile:
      secret: ""
      endpoint: ""
      hostnames: []
  mailer:
    mode: "dev"
    smtp:
      host: ""
      port: "465"
      username: ""
      password: ""
      from: ""
      fromName: "博客"
